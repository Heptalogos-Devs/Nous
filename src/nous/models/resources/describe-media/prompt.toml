contract_id = "media-description"

[documentation]
title = "描述媒体"
purpose = "描述实际输入表示中的媒体内容。"
consumers = ["MediaAnalysis"]
input_notes = '''
question 是观察重点，instructions 是补充要求；
来源可以是图片、音频、视频或已准备的文字。
如果已知，来源旁会说明原件范围、实际时段、页面或采样画面；
媒体以单独附件提供。

`question` 和 `instructions` 为字符串，缺省为空；各任务入口的必填要求见上文。
`sources` 是按请求顺序排列的列表，每项有 `key`、`name` 和 `text`（文字或 null）。
模板变量不包含媒体字节。本资源的 user 模板使用 question 和 instructions；
`append_sources = true` 随后把带键来源和附件按顺序附加到该 user 消息。

### 一次假设请求

模板可读取的值：

`question`：

```text
镜头里的灯光有什么变化？
```

`instructions`：

```text
描述看得到的变化。
```

`sources`：

```json
[
  {
    "key": "S1:V12000-18000",
    "name": "展览短片.mp4",
    "text": null
  }
]
```

模型收到的 user 消息示例：下面的【附件】是对独立媒体部分的说明，不是实际发送的文字。

```text
# 本次问题
镜头里的灯光有什么变化？

描述看得到的变化。

媒体和必要背景如下。

[S1:V12000-18000] 展览短片.mp4
源视频时长约 45 秒。
本次提供源文件第 12–18 秒的视频。
【video/mp4 附件；假设镜头固定在模型上，模型旁的灯由蓝色变为白色】
```
'''
output_notes = '''
模型返回 Markdown 文字，描述实际收到的媒体中可观察的内容；
必要时说明看不清或听不清的部分。
这是媒体描述结果，后续结构化提取使用独立任务。

### 对应该请求的输出示例

```markdown
# 灯光变化

镜头固定在模型上，旁边的灯由蓝色逐渐变为白色。
```
'''
[[messages]]
description = "媒体观察的任务、表达要求与假设例子。"
role = "system"
template = "system.md.j2"
[[messages]]
description = "观察问题和补充要求，之后附加实际媒体表示。"
role = "user"
template = "user.md.j2"
append_sources = true
