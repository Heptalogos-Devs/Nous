name: Python runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the Python project
        run: |
          source scripts/dev-env.sh
          uv python install 3.14
          uv sync --locked
      - name: Python contracts
        run: |
          source scripts/dev-env.sh
          uv run basedpyright --pythonpath "$UV_PROJECT_ENVIRONMENT/bin/python"
          uv run ruff check src tests/python
          uv run pytest tests/python
