name: Python and native runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pkg-config build-essential
      - name: Install the Python workspace
        run: |
          source scripts/dev-env.sh
          uv python install 3.14
          uv sync --locked
      - name: Python and native contracts
        run: |
          source scripts/dev-env.sh
          uv run basedpyright
          uv run ruff check src sdk/python/src native/python/python tests/python
          uv run pytest tests/python native/python/tests
      - name: Native formatting
        run: cargo fmt --manifest-path native/Cargo.toml --all --check
