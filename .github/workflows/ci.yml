name: Python runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    name: check
    runs-on: ubuntu-24.04
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/temp/venvs/nous
      UV_NO_EDITABLE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/temp/build/native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Install the Python project
        run: |
          uv python install 3.14
          uv sync --locked
      - name: Python contracts
        run: |
          sh scripts/check/run.sh --profile ci
