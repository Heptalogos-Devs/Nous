name: Check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Prepare test database runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just dev-prepare
      - run: just check
  windows-fast:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: just check-fast
