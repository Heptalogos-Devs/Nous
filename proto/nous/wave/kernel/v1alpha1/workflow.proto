syntax = "proto3";
package nous.wave.kernel.v1alpha1;
import "nous/wave/kernel/v1alpha1/model.proto";
import "nous/wave/kernel/v1alpha1/longitudinal.proto";
import "nous/wave/v1alpha1/types.proto";
import "nous/wave/v1alpha1/services.proto";
import "nous/wave/v1alpha1/journal.proto";
import "nous/wave/v1alpha1/reflection.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
service KernelQueryService {
  rpc Trace(nous.wave.v1alpha1.CognitionTraceRequest) returns (nous.wave.v1alpha1.CognitionTrace);
  rpc GetCognitiveTime(nous.wave.v1alpha1.SubjectRequest) returns (google.protobuf.Timestamp);
  rpc PrepareQuery(PrepareQueryRequest) returns (nous.wave.v1alpha1.PreparedQueryResponse);
  rpc ActivateQuery(KernelQueryRequest) returns (QueryActivationResponse);
  rpc Query(KernelQueryRequest) returns (KernelQueryResponse);
  rpc FinalizeQuery(FinalizeQueryRequest) returns (nous.wave.v1alpha1.QueryResponse);
  rpc ReleaseQuery(ReleaseQueryRequest) returns (google.protobuf.Empty);
}
service KernelMaintenanceService {
  rpc ReflectionMemoryCandidates(ReflectionMemoryCandidatesRequest) returns (ReflectionMemoryCandidatesResponse);
  rpc PrepareSubjectReflection(PrepareSubjectReflectionRequest) returns (SubjectReflectionBatch);
  rpc FinishSubjectReflection(FinishSubjectReflectionRequest) returns (FinishSubjectReflectionResponse);
  rpc InspectSubjectReflection(nous.wave.v1alpha1.ReflectionInspectRequest) returns (nous.wave.v1alpha1.ReflectionState);
  rpc RefreshMaintenance(RefreshMaintenanceRequest) returns (google.protobuf.Empty);
  rpc PlanMaintenance(PlanMaintenanceRequest) returns (MaintenancePlan);
  rpc GetMaintenancePolicy(nous.wave.v1alpha1.SubjectRequest) returns (MaintenancePolicy);
  rpc SelectMaintenance(SelectMaintenanceRequest) returns (SelectMaintenanceResponse);
  rpc FinishMaintenance(FinishMaintenanceRequest) returns (google.protobuf.Empty);
  rpc OrganizeExperience(OrganizeExperienceRequest) returns (OrganizeExperienceResponse);
  rpc ApplyEpisodePartition(ApplyEpisodePartitionRequest) returns (ApplyEpisodePartitionResponse);
  rpc CommitJournal(CommitJournalRequest) returns (nous.wave.v1alpha1.JournalResponse);
}
service KernelProjectionService {
  rpc BuildContributionBatch(nous.wave.v1alpha1.ProjectionRequest) returns (nous.wave.v1alpha1.Projection);
}
