syntax = "proto3";
package nous.wave.kernel.v1alpha1;
import "nous/wave/v1alpha1/types.proto";
import "nous/wave/v1alpha1/management.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "nous/wave/kernel/v1alpha1/model_results.proto";
message EmbeddingConfig {
  string space_hash = 1;
  string producer_hash = 2;
  string model = 3;
  uint32 dimension = 4;
  repeated string producer_hashes = 5;
}
message QueryEmbedding { string text = 1; string space_hash = 2; string producer_hash = 3; repeated float vector = 4; }
message QueryHostCapabilities { bool embedding_available = 1; bool embedding_required = 2; bool enrichment_available = 3; bool enrichment_required = 4; bool rerank_available = 5; bool rerank_required = 6; }
message PrepareQueryRequest { nous.wave.v1alpha1.QueryRequest query = 1; bool execute_query = 2; uint32 lease_seconds = 3; QueryHostCapabilities host = 4; }
message KernelQueryRequest { reserved 1; QueryEmbedding embedding = 2; optional uint32 validated_candidate_limit = 3; string preparation_token = 4; string subject_id = 5; optional string concept_output = 6; optional string concept_failure = 7; uint32 concept_model_calls = 8; }
message KernelQueryResponse { nous.wave.v1alpha1.QueryResponse response = 1; optional string validation_ticket = 2; }
message RerankCandidate { nous.wave.v1alpha1.CognitiveRef reference = 1; double score = 2; }
message ExternalResourceResult { string action_id = 1; string resource_ref = 2; string status = 3; repeated nous.wave.v1alpha1.ExternalResourceRecord records = 4; }
message FinalizeQueryRequest { string subject_id = 1; string validation_ticket = 2; repeated RerankCandidate order = 3; repeated ExternalResourceResult external_results = 4; }
message ReleaseQueryRequest { string subject_id = 1; string validation_ticket = 2; }
message EmbeddingCursor { string subject_id = 1; int64 content_revision = 2; string view_digest = 3; nous.wave.v1alpha1.CognitiveRef after = 4; }
message EmbeddingNeedsRequest { string subject_id = 1; uint32 limit = 2; optional string preparation_token = 3; EmbeddingCursor cursor = 4; }
message EmbeddingNeed { nous.wave.v1alpha1.CognitiveRef reference = 1; string text = 2; string digest = 3; }
message EmbeddingNeedsResponse { EmbeddingConfig config = 1; repeated EmbeddingNeed needs = 2; EmbeddingCursor next_cursor = 3; }
message EmbeddingSubmission { nous.wave.v1alpha1.CognitiveRef reference = 1; QueryEmbedding material = 2; }
message CommitEmbeddingsRequest { string subject_id = 1; optional string preparation_token = 2; repeated EmbeddingSubmission items = 3; }
message CommitEmbeddingsResponse { uint32 committed = 1; }
message CommitInterpretationRequest {
  string subject_id = 1;
  repeated nous.wave.v1alpha1.DerivationInput inputs = 2;
  string text = 3;
  string kind = 7;
  nous.wave.v1alpha1.ProducerSignature producer = 8;
  string strategy = 10;
  optional string supersedes = 11;
  google.protobuf.Struct quality = 12;
  google.protobuf.Struct structured_payload = 13;
  OperationIdentity operation_identity = 14;
}
service KernelModelResultsService {
  rpc ReadOperation(OperationIdentity) returns (OperationRecord);
  rpc SaveOperation(SaveOperationRequest) returns (google.protobuf.Empty);
}
service KernelMaterialWorkflowService {
  rpc SegmentDescription(nous.wave.v1alpha1.ObjectRequest) returns (DescriptionSegments);
  rpc PrepareFormation(PrepareFormationRequest) returns (PreparedFormation);
  rpc GetEmbeddingConfig(google.protobuf.Empty) returns (EmbeddingConfig);
  rpc ListEmbeddingNeeds(EmbeddingNeedsRequest) returns (EmbeddingNeedsResponse);
  rpc CommitEmbeddings(CommitEmbeddingsRequest) returns (CommitEmbeddingsResponse);
  rpc CommitInterpretation(CommitInterpretationRequest) returns (nous.wave.v1alpha1.DerivedRepresentation);
}
message DescriptionSegment { string key = 1; string text = 2; nous.wave.v1alpha1.CognitiveRef reference = 3; }
message DescriptionSegments { repeated DescriptionSegment segments = 1; }
message OperationIdentity { string subject_id = 1; string owner = 2; string operation_key = 3; string semantic_digest = 4; }
message OperationRecord { ModelResultContext context = 1; ResultPayload proposal = 2; ResultPayload outcome = 3; ExecutionTelemetry execution_telemetry = 4; }
message SaveOperationRequest { OperationIdentity identity = 1; ResultPayload proposal = 2; ResultPayload outcome = 3; ExecutionTelemetry execution_telemetry = 4; repeated string mutation_operations = 5; ModelResultContext context = 6; }
message PrepareFormationRequest { string subject_id = 1; string occurrence_id = 2; optional string representation_id = 3; bool audio_description = 4; bool resolved_mentions = 5; uint64 max_bytes = 6; }
message ResolvedMention { string key = 1; string surface = 2; string entity_ref = 3; }
message PreparedFormation { nous.wave.v1alpha1.MaterializedEvidence source = 1; repeated ResolvedMention candidates = 2; }
message QueryActivationResponse { string preparation_token = 1; string model_input = 2; }
