syntax = "proto3";
package nous.wave.kernel.v1alpha1;
import "nous/wave/v1alpha1/types.proto";
import "nous/wave/v1alpha1/journal.proto";
import "nous/wave/v1alpha1/management.proto";
import "google/protobuf/timestamp.proto";
import "nous/wave/v1alpha1/presentation.proto";

message MaintenanceNeed {
  string need_id = 1;
  string subject_id = 2;
  string kind = 3;
  string scope_kind = 4;
  string scope_ref = 5;
  int64 trigger_authority_seq = 6;
  google.protobuf.Timestamp due_at = 7;
  int32 priority = 8;
  string state = 9;
  optional string last_problem_code = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  uint32 retry_count = 16;
  uint64 trigger_revision = 17;
}
message SelectMaintenanceRequest { string subject_id = 1; repeated string allowed_kinds = 2; uint32 limit = 3; optional string model_execution_digest = 5; MaintenanceNeed after = 6; }
message SelectMaintenanceResponse { repeated MaintenanceNeed needs = 1; }
message FinishMaintenanceRequest { MaintenanceNeed selected = 1; string disposition = 2; google.protobuf.Timestamp next_due = 3; optional string problem_code = 4; uint32 retry_delay_seconds = 5; }
message OrganizeExperienceRequest { string subject_id = 1; uint32 limit = 2; bool close = 3; }
message OrganizeExperienceResponse { uint32 processed_count = 1; repeated nous.wave.v1alpha1.Episode episodes = 2; google.protobuf.Timestamp next_due = 3; }
message EpisodePartitionSource { string revision_id = 1 [(nous.wave.v1alpha1.reference_kind) = "episode_revision"]; int64 expected_epoch = 2; }
message EpisodePartitionSegment { repeated uint32 member_indices = 1; optional string title = 2; string boundary_explanation = 3; }
message ApplyEpisodePartitionRequest {
  string operation_id = 1;
  string subject_id = 2 [(nous.wave.v1alpha1.reference_kind) = "subject"];
  int64 expected_authority_seq = 3;
  repeated EpisodePartitionSource sources = 4;
  repeated string ordered_occurrences = 5 [(nous.wave.v1alpha1.reference_kind) = "occurrence"];
  repeated EpisodePartitionSegment segments = 6;
  nous.wave.v1alpha1.ProducerSignature producer = 7;
}
message ApplyEpisodePartitionResponse { repeated nous.wave.v1alpha1.Episode episodes = 1; }
message JournalTarget { string journal_id = 1 [(nous.wave.v1alpha1.reference_kind) = "journal"]; string expected_revision_id = 2 [(nous.wave.v1alpha1.reference_kind) = "journal_revision"]; int64 expected_epoch = 3; string intent = 4; }
message CommitJournalRequest {
  string operation_id = 1;
  string subject_id = 2 [(nous.wave.v1alpha1.reference_kind) = "subject"];
  int64 expected_authority_seq = 3;
  JournalTarget target = 4;
  repeated EpisodePartitionSource sources = 5;
  optional string title = 6;
  string narrative = 7;
  repeated nous.wave.v1alpha1.JournalPoint points = 8;
  nous.wave.v1alpha1.ProducerSignature producer = 9;
}
message MaintenancePolicy {
  bool enabled = 1;
  uint32 poll_interval_seconds = 2;
  uint32 max_operations = 3;
  google.protobuf.Timestamp cognitive_now = 5;
  uint32 retry_initial_seconds = 6;
  uint32 retry_max_seconds = 7;
  uint32 retry_max_attempts = 8;
  uint32 max_model_calls = 9;
  uint32 max_elapsed_ms = 10;
  uint32 experience_batch_size = 11;
}
message PlanMaintenanceRequest { MaintenanceNeed selected = 1; }
message ExperienceMember {
  string key = 1;
  string occurrence_id = 2 [(nous.wave.v1alpha1.reference_kind) = "occurrence"];
  optional int64 recorded_seq = 3;
  google.protobuf.Timestamp observed_at = 4;
  optional string session_id = 5 [(nous.wave.v1alpha1.reference_kind) = "session"];
  optional string work_context_id = 6 [(nous.wave.v1alpha1.reference_kind) = "work_context"];
  optional int64 work_context_revision = 7;
  optional string conversation_ref = 8;
  optional string actor_entity_ref = 9;
  string source_class = 10;
  string text = 11;
  bool text_partial = 12;
  nous.wave.v1alpha1.TemporalExtent occurred_time = 13;
}
message BasisCatalogEntry { string key = 1; nous.wave.v1alpha1.RevisionBasis basis = 2; }
message MaintenancePlan {
  string subject_id = 1 [(nous.wave.v1alpha1.reference_kind) = "subject"];
  int64 authority_seq = 2;
  google.protobuf.Timestamp cognitive_now = 3;
  string status = 4;
  repeated EpisodePartitionSource sources = 5;
  repeated nous.wave.v1alpha1.Episode episodes = 6;
  repeated ExperienceMember members = 7;
  repeated BasisCatalogEntry basis = 8;
  JournalTarget target = 9;
  nous.wave.v1alpha1.JournalRevision journal = 10;
  google.protobuf.Timestamp next_due = 11;
  optional string problem_code = 12;
  ExpectedCognition consolidation_source = 13;
  repeated ConsolidationCandidate candidates = 14;
  repeated ConsolidationEntity entities = 15;
  repeated ProvenanceRoot provenance_roots = 16;
  uint32 max_consolidation_actions = 17;
  bool basis_catalog_partial = 18;
  bool provenance_roots_partial = 19;
  ConceptMaintenanceCatalog concept_catalog = 20;
  optional string concept_model_input_json = 21;
}
message RefreshMaintenanceRequest { MaintenanceNeed selected = 1; }

message ConsolidationCandidate { string key = 1; ExpectedCognition target = 2; string text = 3; string cognitive_role = 4; string formation_mode = 5; repeated string entity_refs = 6; repeated UseSummary use = 7; repeated string eligible_basis_keys = 11; nous.wave.v1alpha1.TemporalExtent valid_time = 8; google.protobuf.Timestamp formed_at = 9; google.protobuf.Timestamp recorded_at = 10; bool text_truncated = 12; }
message ConsolidationEntity { string key = 1; string entity_ref = 2; }
message ProvenanceRoot { string key = 1; string certainty = 2; }
message UseSummary { string kind = 1; uint64 count = 2; google.protobuf.Timestamp last_used_at = 3; }

message ConceptMaintenanceCatalog {
  uint32 max_suggestions = 1;
  string config_digest = 2;
  repeated ConceptReference references = 3;
  repeated ConceptTag tags = 4;
  repeated ConceptAssociation associations = 5;
  repeated ConceptBasis basis = 6;
}
message ConceptReference { string key = 1; nous.wave.v1alpha1.CognitiveRef reference = 2; }
message ConceptTag { string key = 1; nous.wave.v1alpha1.TagRevisionTarget target = 2; }
message ConceptAssociation { string key = 1; string association_id = 2 [(nous.wave.v1alpha1.reference_kind) = "association"]; string from_key = 3; string to_key = 4; string relation = 5; }
message ConceptBasis { string key = 1; nous.wave.v1alpha1.AssociationBasis basis = 2; }

message ExpectedCognition { nous.wave.v1alpha1.CognitiveRef reference = 1; int64 expected_epoch = 2; string object_id = 3; }

message PrepareSubjectReflectionRequest {MaintenanceNeed selected=1;}
message SubjectReflectionSource {nous.wave.v1alpha1.CognitiveRef reference=1;int64 recorded_sequence=2;optional string work_context_id=3;optional int64 work_context_revision=4;optional string session_id=5;}
message SubjectReflectionSourceChange {int64 change_id=1;nous.wave.v1alpha1.CognitiveRef reference=2;string reason=3;google.protobuf.Timestamp recorded_at=4;}
message SubjectReflectionBatch {MaintenanceNeed selected=1;int64 from_sequence=2;int64 through_sequence=3;repeated SubjectReflectionSource sources=4;bool more=5;repeated string domains=6;uint64 source_max_bytes=7;uint64 candidate_limit=8;uint64 candidate_max_bytes=9;uint64 max_actions=10;repeated SubjectReflectionSourceChange changes=11;int64 through_change_id=12;}
message FinishSubjectReflectionRequest {MaintenanceNeed selected=1;int64 through_sequence=2;string operation_id=3;string status=4;optional string problem_code=5;int64 through_change_id=6;}
message FinishSubjectReflectionResponse {uint32 operations_consumed=1;}
message ReflectionMemoryCandidatesRequest {string subject_id=1;repeated nous.wave.v1alpha1.CognitiveRef references=2;uint32 max_items=3;uint64 max_bytes=4;}
message ReflectionMemoryCandidatesResponse {repeated nous.wave.v1alpha1.Memory items=1;bool omitted=2;}
