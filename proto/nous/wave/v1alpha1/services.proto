syntax = "proto3";
package nous.wave.v1alpha1;
import "nous/wave/v1alpha1/journal.proto";
import "google/protobuf/empty.proto";
import "nous/wave/v1alpha1/management.proto";
import "nous/wave/v1alpha1/types.proto";
import "nous/wave/v1alpha1/cognition.proto";

service SubjectService { rpc CreateSubject(CreateSubjectRequest) returns (Subject); rpc GetSubject(SubjectRequest) returns (Subject); rpc ListSubjects(ListRequest) returns (ListSubjectsResponse); rpc GetCognitiveSeed(SubjectRequest) returns (CognitiveSeedVersion); rpc AdoptCognitiveSeed(AdoptCognitiveSeedRequest) returns (CognitiveSeedVersion); }
service RuntimeService {
  rpc OpenSession(SubjectRequest) returns (Session);
  rpc GetSession(ObjectRequest) returns (Session);
  rpc ListSessions(ListRequest) returns (ListSessionsResponse);
  rpc CloseSession(ObjectRequest) returns (Session);
  rpc RecordObservation(ObservationInput) returns (AcceptedObservation);
  rpc ReportUse(ReportUseRequest) returns (ReportUseResponse);
  rpc CreateWorkContext(CreateWorkContextRequest) returns (WorkContextResponse);
  rpc GetWorkContext(GetWorkContextRequest) returns (WorkContextResponse);
  rpc ListWorkContexts(ListWorkContextsRequest) returns (ListWorkContextsResponse);
  rpc UpdateWorkContext(UpdateWorkContextRequest) returns (WorkContextResponse);
  rpc PauseWorkContext(WorkContextMutationRequest) returns (WorkContextResponse);
  rpc ResumeWorkContext(WorkContextMutationRequest) returns (WorkContextResponse);
  rpc EndWorkContext(WorkContextMutationRequest) returns (WorkContextResponse);
  rpc SetActiveWorkContext(SetActiveWorkContextRequest) returns (Session);
}
service CognitionService {
  rpc GrantMaintenance(MaintenanceGrantRequest) returns (MaintenanceGrantResponse);
  rpc PrepareQuery(QueryRequest) returns (PreparedQueryResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc BuildProjection(ProjectionRequest) returns (Projection);
  rpc BuildManagedContext(ManagedContextRequest) returns (ManagedContextResponse);
}
service MemoryService {
  rpc ReadCognition(ReadCognitionRequest) returns (CognitionResult);
  rpc ListCognitions(CognitionListRequest) returns (CognitionPage);
  rpc ListCognitionHistory(CognitionHistoryRequest) returns (CognitionPage);
  rpc MutateCognition(CognitionMutationRequest) returns (CognitionMutationResponse);
  rpc LinkRevisions(LinkRevisionsRequest) returns (google.protobuf.Empty);
  rpc FormMemory(FormMemoryRequest) returns (Memory);
  rpc ReviseMemory(ReviseMemoryRequest) returns (Memory);
  rpc CreateEpisode(CreateEpisodeRequest) returns (EpisodeResponse);
  rpc ReviseEpisode(ReviseEpisodeRequest) returns (EpisodeResponse);
  rpc LinkEpisodeRevisions(LinkEpisodeRevisionsRequest) returns (google.protobuf.Empty);
}
service MaterialService { rpc ListOccurrences(OccurrenceListRequest) returns (OccurrenceListResponse); rpc GetDerivedRegion(ObjectRequest) returns (DerivedRegion); rpc GetProducer(ObjectRequest) returns (ProducerSignature); rpc ListDerivedRepresentations(RepresentationListRequest) returns (RepresentationListResponse); rpc GetLimits(google.protobuf.Empty) returns (MaterialLimits); rpc GetOccurrence(ObjectRequest) returns (Occurrence); rpc GetSourceRegion(ObjectRequest) returns (SourceRegion); rpc GetDerivedRepresentation(ObjectRequest) returns (DerivedRepresentation); rpc GetArtifact(ObjectRequest) returns (Artifact); rpc ListArtifacts(ListRequest) returns (ListArtifactsResponse); rpc MaterializeEvidence(MaterializeRequest) returns (MaterializedEvidence); }
