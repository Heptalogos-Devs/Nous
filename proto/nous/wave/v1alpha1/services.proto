syntax = "proto3";
package nous.wave.v1alpha1;
import "nous/wave/v1alpha1/journal.proto";
import "nous/wave/v1alpha1/self.proto";
import "nous/wave/v1alpha1/presentation.proto";
import "google/protobuf/empty.proto";
import "nous/wave/v1alpha1/management.proto";
import "nous/wave/v1alpha1/types.proto";

service SubjectService { rpc ProvisionCapabilities(ProvisionCapabilitiesRequest) returns (Subject) { option idempotency_level = IDEMPOTENT; } rpc CreateSubject(CreateSubjectRequest) returns (Subject) { option idempotency_level = IDEMPOTENT; } rpc GetSubject(SubjectRequest) returns (Subject); rpc ListSubjects(ListRequest) returns (ListSubjectsResponse); rpc GetCognitiveSeed(SubjectRequest) returns (CognitiveSeedVersion); rpc AdoptCognitiveSeed(AdoptCognitiveSeedRequest) returns (CognitiveSeedVersion) { option idempotency_level = IDEMPOTENT; } }
service RuntimeService {
  rpc OpenSession(OpenSessionRequest) returns (Session);
  rpc GetSession(ObjectRequest) returns (Session);
  rpc ListSessions(ListRequest) returns (ListSessionsResponse);
  rpc CloseSession(ObjectRequest) returns (Session);
  rpc RecordObservation(ObservationInput) returns (AcceptedObservation) { option idempotency_level = IDEMPOTENT; }
  rpc ReportUse(ReportUseRequest) returns (ReportUseResponse) { option idempotency_level = IDEMPOTENT; }
  rpc CreateWorkContext(CreateWorkContextRequest) returns (WorkContextResponse) { option idempotency_level = IDEMPOTENT; }
  rpc GetWorkContext(GetWorkContextRequest) returns (WorkContextResponse);
  rpc ListWorkContexts(ListWorkContextsRequest) returns (ListWorkContextsResponse);
  rpc UpdateWorkContext(UpdateWorkContextRequest) returns (WorkContextResponse) { option idempotency_level = IDEMPOTENT; }
  rpc PauseWorkContext(WorkContextMutationRequest) returns (WorkContextResponse) { option idempotency_level = IDEMPOTENT; }
  rpc ResumeWorkContext(WorkContextMutationRequest) returns (WorkContextResponse) { option idempotency_level = IDEMPOTENT; }
  rpc EndWorkContext(WorkContextMutationRequest) returns (WorkContextResponse) { option idempotency_level = IDEMPOTENT; }
  rpc SetActiveWorkContext(SetActiveWorkContextRequest) returns (Session) { option idempotency_level = IDEMPOTENT; }
}
service CognitionService {
  rpc GrantMaintenance(MaintenanceGrantRequest) returns (MaintenanceGrantResponse);
  rpc PrepareQuery(QueryRequest) returns (PreparedQueryResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc BuildProjection(ProjectionRequest) returns (Projection);
  rpc BuildManagedContext(ManagedContextRequest) returns (ManagedContextResponse);
}
message CognitionTraceRequest { string subject_id = 1 [(reference_kind) = "subject"]; CognitiveRef reference = 2; uint32 max_nodes = 3; uint32 max_bytes = 4; }
message CognitionTraceNode { CognitiveRef reference = 1; oneof content { Memory memory = 2; CognitiveSchema schema = 3; EpisodeRevision episode = 4; JournalRevision journal = 5; } }
message CognitionTrace { CognitiveRef reference = 1; repeated CognitionTraceNode nodes = 2; MaterialLineage lineage = 3; repeated ProducerSignature producers = 4; bool truncated = 5; }
service MemoryService {
  rpc Trace(CognitionTraceRequest) returns (CognitionTrace);
  rpc GetJournal(ObjectRequest) returns (JournalResponse);
  rpc GetJournalRevision(ObjectRequest) returns (JournalRevision);
  rpc ListJournals(ListRequest) returns (ListJournalsResponse);
  rpc ListJournalRevisions(ListJournalRevisionsRequest) returns (ListJournalRevisionsResponse);
  rpc SuppressJournal(JournalMutationRequest) returns (JournalResponse) { option idempotency_level = IDEMPOTENT; }
  rpc RestoreJournal(JournalMutationRequest) returns (JournalResponse) { option idempotency_level = IDEMPOTENT; }
  rpc WithdrawJournal(JournalMutationRequest) returns (JournalResponse) { option idempotency_level = IDEMPOTENT; }
  rpc ReacceptJournal(JournalMutationRequest) returns (JournalResponse) { option idempotency_level = IDEMPOTENT; }
  rpc PurgeJournal(JournalMutationRequest) returns (google.protobuf.Empty) { option idempotency_level = IDEMPOTENT; }
  rpc SetAccessibility(SetAccessibilityRequest) returns (Memory) { option idempotency_level = IDEMPOTENT; }
  rpc LinkRevisions(LinkRevisionsRequest) returns (google.protobuf.Empty) { option idempotency_level = IDEMPOTENT; }
  rpc GetMemory(ObjectRequest) returns (Memory);
  rpc ListMemories(ListRequest) returns (ListMemoriesResponse);
  rpc GetMemoryRevision(ObjectRequest) returns (Memory);
  rpc ListMemoryRevisions(MemoryHistoryRequest) returns (ListMemoriesResponse);
  rpc FormMemory(FormMemoryRequest) returns (Memory) { option idempotency_level = IDEMPOTENT; }
  rpc ReviseMemory(ReviseMemoryRequest) returns (Memory) { option idempotency_level = IDEMPOTENT; }
  rpc SuppressMemory(MemoryMutationRequest) returns (Memory) { option idempotency_level = IDEMPOTENT; }
  rpc RestoreMemory(MemoryMutationRequest) returns (Memory) { option idempotency_level = IDEMPOTENT; }
  rpc WithdrawMemory(MemoryMutationRequest) returns (Memory) { option idempotency_level = IDEMPOTENT; }
  rpc ReacceptMemory(MemoryMutationRequest) returns (Memory) { option idempotency_level = IDEMPOTENT; }
  rpc PurgeMemory(MemoryMutationRequest) returns (google.protobuf.Empty) { option idempotency_level = IDEMPOTENT; }
  rpc CreateEpisode(CreateEpisodeRequest) returns (EpisodeResponse) { option idempotency_level = IDEMPOTENT; }
  rpc GetEpisode(ObjectRequest) returns (EpisodeResponse);
  rpc GetEpisodeRevision(ObjectRequest) returns (EpisodeRevision);
  rpc ListEpisodes(ListRequest) returns (ListEpisodesResponse);
  rpc ListEpisodeRevisions(ListEpisodeRevisionsRequest) returns (ListEpisodeRevisionsResponse);
  rpc ReviseEpisode(ReviseEpisodeRequest) returns (EpisodeResponse) { option idempotency_level = IDEMPOTENT; }
  rpc LinkEpisodeRevisions(LinkEpisodeRevisionsRequest) returns (google.protobuf.Empty) { option idempotency_level = IDEMPOTENT; }
  rpc SuppressEpisode(EpisodeMutationRequest) returns (EpisodeResponse) { option idempotency_level = IDEMPOTENT; }
  rpc RestoreEpisode(EpisodeMutationRequest) returns (EpisodeResponse) { option idempotency_level = IDEMPOTENT; }
  rpc WithdrawEpisode(EpisodeMutationRequest) returns (EpisodeResponse) { option idempotency_level = IDEMPOTENT; }
  rpc ReacceptEpisode(EpisodeMutationRequest) returns (EpisodeResponse) { option idempotency_level = IDEMPOTENT; }
  rpc PurgeEpisode(EpisodeMutationRequest) returns (google.protobuf.Empty) { option idempotency_level = IDEMPOTENT; }
}
service MaterialService { rpc ReadLineage(MaterialLineageRequest) returns (MaterialLineage); rpc Clean(google.protobuf.Empty) returns (MaterialCleanup); rpc ListOccurrences(OccurrenceListRequest) returns (OccurrenceListResponse); rpc GetDerivedRegion(ObjectRequest) returns (DerivedRegion); rpc GetProducer(ObjectRequest) returns (ProducerSignature); rpc ListDerivedRepresentations(RepresentationListRequest) returns (RepresentationListResponse); rpc GetLimits(google.protobuf.Empty) returns (MaterialLimits); rpc GetOccurrence(ObjectRequest) returns (Occurrence); rpc GetSourceRegion(ObjectRequest) returns (SourceRegion); rpc GetDerivedRepresentation(ObjectRequest) returns (DerivedRepresentation); rpc GetArtifact(ObjectRequest) returns (Artifact); rpc ListArtifacts(ListRequest) returns (ListArtifactsResponse); rpc MaterializeEvidence(MaterializeRequest) returns (MaterializedEvidence); }
