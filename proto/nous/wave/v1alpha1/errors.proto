syntax = "proto3";
package nous.wave.v1alpha1;

// Business semantics are independent of the generic Connect/gRPC status code.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNKNOWN_REFERENCE = 1;
  ERROR_CODE_AMBIGUOUS_REFERENCE = 2;
  ERROR_CODE_REFERENCE_TYPE_MISMATCH = 3;
  ERROR_CODE_REFERENCE_TOMBSTONED = 4;
  ERROR_CODE_UNRESOLVED_MACHINE_PLACEHOLDER = 5;
  ERROR_CODE_STALE_CONTEXT = 6;
  ERROR_CODE_STALE_REVISION = 7;
  ERROR_CODE_OPERATION_ID_CONFLICT = 8;
  ERROR_CODE_OPERATION_IN_PROGRESS = 9;
  ERROR_CODE_LEASE_LOST = 10;
  ERROR_CODE_CAPABILITY_UNAVAILABLE = 11;
  ERROR_CODE_INVALID_REQUEST = 12;
  ERROR_CODE_NOT_FOUND = 13;
  ERROR_CODE_CONFLICT = 14;
  ERROR_CODE_FAILED_PRECONDITION = 15;
  ERROR_CODE_UNAVAILABLE = 16;
  ERROR_CODE_INTERNAL_FAILURE = 17;
  ERROR_CODE_CAPACITY_EXHAUSTED = 18;
  ERROR_CODE_INSTANCE_ALREADY_RUNNING = 19;
}

// Guidance, never an instruction to perform an automatic retry or mutation.
enum ErrorRecovery {
  ERROR_RECOVERY_UNSPECIFIED = 0;
  ERROR_RECOVERY_RESOLVE_REFERENCE = 1;
  ERROR_RECOVERY_SELECT_CANDIDATE = 2;
  ERROR_RECOVERY_CORRECT_REQUEST = 3;
  ERROR_RECOVERY_REDISCOVER_REFERENCE = 4;
  ERROR_RECOVERY_REFRESH_STATE = 5;
  // Resume the original frozen operation identity after obtaining a new lease.
  ERROR_RECOVERY_RETRY_OPERATION = 6;
  // Different semantic inputs require a different operation identity.
  ERROR_RECOVERY_NEW_OPERATION = 7;
  ERROR_RECOVERY_CHECK_CONFIGURATION = 8;
}

enum ErrorOwner {
  ERROR_OWNER_UNSPECIFIED = 0;
  ERROR_OWNER_IDENTITY = 1;
  ERROR_OWNER_SUBJECT = 2;
  ERROR_OWNER_MEMORY = 3;
  ERROR_OWNER_MATERIAL = 4;
  ERROR_OWNER_RUNTIME = 5;
  ERROR_OWNER_CONFIGURATION = 6;
  ERROR_OWNER_CONCEPT = 7;
  ERROR_OWNER_OBSERVATION = 8;
  ERROR_OWNER_RESOURCE = 9;
  ERROR_OWNER_MODEL_WORKFLOW = 10;
  ERROR_OWNER_KERNEL = 11;
  ERROR_OWNER_CORE = 12;
  ERROR_OWNER_PERSISTENCE = 13;
  ERROR_OWNER_INSTANCE = 14;
  ERROR_OWNER_CLI = 15;
}

// Carried as a typed Connect detail / google.rpc.Status Any.
// context contains owner-selected IDs/revisions, never opaque user content.
message ErrorDetail {
  ErrorCode code = 1;
  ErrorRecovery recovery = 2;
  map<string, string> context = 3;
  ErrorOwner owner = 4;
  string trace_id = 5;
}
