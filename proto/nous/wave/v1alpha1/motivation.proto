syntax = "proto3";
package nous.wave.v1alpha1;
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "nous/wave/v1alpha1/types.proto";
import "nous/wave/v1alpha1/presentation.proto";
message MotivationScope {string description=1;repeated string entities=2 [(reference_kind)="entity"];optional string group=3 [(reference_kind)="entity"];optional string channel=4;optional string conversation=5;optional string work_context=6 [(reference_kind)="work_context"];optional string domain=7;}
message EventWitnessCriterion {uint32 version=1;string event_type=2;optional string target=3;optional string activity=4;}
message OwnerStateCriterion {uint32 version=1;CognitiveRef reference=2;string state=3;}
message MeasurementCriterion {uint32 version=1;string name=2;string unit=3;string comparison=4;double value=5;}
message RelationCriterion {uint32 version=1;CognitiveRef reference=2;string relation_type=3;optional string degree=4;}
message SemanticCriterion {uint32 version=1;string question=2;repeated CognitiveRef material_refs=3;}
message CriterionOperands {repeated CriterionExpression items=1;}
message CriterionExpression {oneof expression {EventWitnessCriterion event_witness=1;OwnerStateCriterion owner_state=2;MeasurementCriterion measurement=3;RelationCriterion relation=4;SemanticCriterion semantic=5;CriterionOperands all=6;CriterionOperands any=7;CriterionExpression not=8;}}
message DesiredConditionContent {CriterionExpression expression=1;string temporal_form=2;DomainTemporalExtent window=3;string coverage_requirement=4;optional uint64 hold_seconds=5;}
message MotivationLink {string relation=1;CognitiveRef target_revision=2;}
message MotivationContent {string family=1;string matter_key=2;string statement=3;MotivationScope scope=4;repeated RevisionBasis basis=5;DomainTemporalExtent valid_time =6;ProducerSignature producer=7;repeated MotivationLink links=8;DesiredConditionContent condition=9;}
message MotivationEvidence {string role=1;RevisionBasis basis=2;google.protobuf.Timestamp recorded_at=3;}
message MotivationRecord {CognitiveRef reference=1;CognitiveRef object_ref=2;string subject_id=3 [(reference_kind)="subject"];string current_revision_id=4;int64 object_epoch=5;int32 revision_no=6;optional string parent_revision_id=7;string reason=8;MotivationContent content=9;string acceptance_state=10;string integrity_state=11;string suppression_state=12;google.protobuf.Timestamp created_at=13;DomainStamp formed_at=14;google.protobuf.Timestamp recorded_at=15;repeated MotivationEvidence evidence=16;reserved 17;}
message AdoptMotivationRequest {string subject_id=1 [(reference_kind)="subject"];string operation_id=2;MotivationContent content=3;string reason=4;}
message ReviseMotivationRequest {string subject_id=1 [(reference_kind)="subject"];string operation_id=2;CognitiveRef target_revision=3;int64 expected_object_epoch=4;MotivationContent content=5;string reason=6;}
message AddMotivationEvidenceRequest {string subject_id=1 [(reference_kind)="subject"];string operation_id=2;CognitiveRef target_revision=3;int64 expected_object_epoch=4;string role=5;RevisionBasis basis=6;}
message MotivationListRequest {string subject_id=1 [(reference_kind)="subject"];string family=2;Page page=3;}
message MotivationHistoryRequest {string subject_id=1 [(reference_kind)="subject"];CognitiveRef object_ref=2;Page page=3;}
message MotivationListResponse {repeated MotivationRecord items=1;string next_page_token=2;}
message MotivationMutationRequest {string subject_id=1 [(reference_kind)="subject"];string operation_id=2;CognitiveRef object_ref=3;int64 expected_object_epoch=4;}
message MotivationLifecycleRequest {MotivationMutationRequest mutation=1;string action=2;}
message MotivationSelectionRequest {string subject_id=1 [(reference_kind)="subject"];MotivationScope scope=2;SourceReadScope source_read=3;uint32 max_items=4;uint32 max_bytes=5;optional string after=6;DomainStamp at=7;google.protobuf.Timestamp as_of=8;bool history=9;}
message MotivationSelectionResponse {repeated MotivationRecord items=1;optional string next=2;bool omitted=3;}
message EvaluateConditionRequest {string subject_id=1 [(reference_kind)="subject"];string operation_id=2;CognitiveRef condition_revision=3;MotivationScope scope=4;SourceReadScope source_read=5;repeated CognitiveRef evidence_refs=6;}
message CriterionSample {google.protobuf.Timestamp at=1;string truth=2;repeated CognitiveRef evidence=3;}
message CriterionRead {string evaluator=1;repeated CriterionSample samples=2;bool complete=3;string method=4;ProducerSignature producer=5;}
message ConditionEvaluation {string evaluation_id=1;CognitiveRef condition_revision=2;optional bool applicable=3;string verdict=4;bool final_conclusion=5;DomainTemporalExtent evaluated_interval=6;string coverage=7;string evaluator_identity=8;repeated CognitiveRef inputs=9;repeated CriterionRead leaves=10;DomainStamp evaluated=11;string explanation=12;}
service MotivationService {
 rpc Adopt(AdoptMotivationRequest) returns(MotivationRecord) {option idempotency_level=IDEMPOTENT;}
 rpc Revise(ReviseMotivationRequest) returns(MotivationRecord) {option idempotency_level=IDEMPOTENT;}
 rpc AddEvidence(AddMotivationEvidenceRequest) returns(MotivationRecord) {option idempotency_level=IDEMPOTENT;}
 rpc Get(ObjectRequest) returns(MotivationRecord);
 rpc GetRevision(ObjectRequest) returns(MotivationRecord);
 rpc List(MotivationListRequest) returns(MotivationListResponse);
 rpc ListRevisions(MotivationHistoryRequest) returns(MotivationListResponse);
 rpc Select(MotivationSelectionRequest) returns(MotivationSelectionResponse);
 rpc SetLifecycle(MotivationLifecycleRequest) returns(MotivationRecord) {option idempotency_level=IDEMPOTENT;}
 rpc Purge(MotivationMutationRequest) returns(google.protobuf.Empty) {option idempotency_level=IDEMPOTENT;}
 rpc Evaluate(EvaluateConditionRequest) returns(ConditionEvaluation) {option idempotency_level=IDEMPOTENT;}
 rpc GetEvaluation(ObjectRequest) returns(ConditionEvaluation);
 rpc ListEvaluations(ConditionEvaluationListRequest) returns(ConditionEvaluationListResponse);
}
// Actual source facts, carried in ObservationInput.context. They grant no read scope.
message CriterionEventFact {uint32 version=1;string event_type=2;optional string target=3;optional string activity=4;DomainStamp at=5;}
message CriterionMeasurementFact {uint32 version=1;string name=2;string unit=3;double value=4;double error=5;DomainStamp at=6;}
message CriterionFact {oneof fact {CriterionEventFact event=1;CriterionMeasurementFact measurement=2;}}
message ConditionEvaluationListRequest {string subject_id=1 [(reference_kind)="subject"];CognitiveRef condition_revision=2;Page page=3;}
message ConditionEvaluationListResponse {repeated ConditionEvaluation items=1;string next_page_token=2;}
