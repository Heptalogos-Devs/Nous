syntax = "proto3";
package nous.wave.v1alpha1;
import "nous/wave/v1alpha1/presentation.proto";
import "nous/wave/v1alpha1/types.proto";

message JournalPoint {
  int32 ordinal = 1;
  string role = 2;
  string text = 3;
  repeated RevisionBasis basis = 4;
}
message JournalRevision {
  CognitionRevisionHeader header = 1;
  optional string revision_intent = 2;
  optional string title = 3;
  TemporalExtent temporal_scope = 4;
  string narrative = 5;
  repeated JournalPoint points = 6;
  repeated CognitiveRef sources = 7;
}
message Journal { CognitionHeader header = 1; JournalRevision revision = 2; }
message JournalResponse { Journal journal = 1; repeated Degradation degradation = 2; }
message MaintenanceGrantRequest { string subject_id = 1 [(reference_kind) = "subject"]; uint32 max_operations = 2; uint32 max_model_calls = 3; uint32 max_elapsed_ms = 4; }
message MaintenanceOperationResult { string need_id = 1; string kind = 2; string status = 3; optional string problem_code = 4; }
message MaintenanceGrantResponse { repeated MaintenanceOperationResult results = 1; uint32 model_calls = 2; uint32 elapsed_ms = 3; string disposition = 4; }
