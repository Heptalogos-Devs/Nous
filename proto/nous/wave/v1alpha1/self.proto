syntax = "proto3";
package nous.wave.v1alpha1;
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "nous/wave/v1alpha1/types.proto";
import "nous/wave/v1alpha1/presentation.proto";

message SelfScope {
  string description = 1;
  repeated string purposes = 2;
  repeated string entity_refs = 3 [(reference_kind) = "entity"];
  optional string work_context_id = 4 [(reference_kind) = "work_context"];
  optional string conversation_ref = 5;
}
message SelfException { string statement = 1; repeated RevisionBasis basis = 2; }
message SelfFacetContent {
  string kind = 1;
  string statement = 2;
  SelfScope scope = 3;
  string stance = 4;
  repeated SelfException exceptions = 5;
  repeated RevisionBasis basis = 6;
  DomainTemporalExtent valid_time = 7;
  ProducerSignature producer = 8;
  string epistemic_class = 9;
  DomainKnowledge domain_knowledge = 10;
}
message NarrativeContent {
  string theme = 1;
  string interpretation = 2;
  repeated CognitiveRef source_refs = 3;
  repeated RevisionBasis basis = 4;
  DomainTemporalExtent valid_time = 5;
  ProducerSignature producer = 6;
  string epistemic_class = 7;
}
message SelfContent { oneof content { SelfFacetContent facet = 1; NarrativeContent narrative = 2; } }
message SelfEvidence { string role = 1; RevisionBasis basis = 2; google.protobuf.Timestamp recorded_at = 3; }
message SelfRecord {
  CognitiveRef reference = 1;
  CognitiveRef object_ref = 2;
  string subject_id = 3 [(reference_kind) = "subject"];
  string current_revision_id = 4;
  int64 object_epoch = 5;
  int32 revision_no = 6;
  optional string parent_revision_id = 7;
  string reason = 8;
  SelfContent content = 9;
  string acceptance_state = 10;
  string integrity_state = 11;
  string suppression_state = 12;
  google.protobuf.Timestamp created_at = 13;
  DomainStamp formed_at = 14;
  google.protobuf.Timestamp recorded_at = 15;
  repeated SelfEvidence evidence = 16;
}
message AdoptSelfRequest {string subject_id = 1 [(reference_kind) = "subject"]; string operation_id = 2; SelfContent content = 3; string reason = 4;}
message ReviseSelfRequest {string subject_id = 1 [(reference_kind) = "subject"]; string operation_id = 2; CognitiveRef target_revision = 3; int64 expected_object_epoch = 4; SelfContent content = 5; string reason = 6;}
message AddSelfEvidenceRequest {string subject_id = 1 [(reference_kind) = "subject"]; string operation_id = 2; CognitiveRef target_revision = 3; int64 expected_object_epoch = 4; string role = 5; RevisionBasis basis = 6;}
message SelfListRequest {string subject_id = 1 [(reference_kind) = "subject"]; string family = 2; Page page = 3;}
message SelfHistoryRequest {string subject_id = 1 [(reference_kind) = "subject"]; CognitiveRef object_ref = 2; Page page = 3;}
message SelfListResponse {repeated SelfRecord items = 1; string next_page_token = 2;}
message SelfMutationRequest {string subject_id = 1 [(reference_kind) = "subject"]; string operation_id = 2; CognitiveRef object_ref = 3; int64 expected_object_epoch = 4;}
message SelfLifecycleRequest {SelfMutationRequest mutation = 1; string action = 2;}
message ProvisionCapabilitiesRequest {string subject_id = 1 [(reference_kind) = "subject"]; string operation_id = 2; SubjectCapabilities capabilities = 3;}
// Bounded current candidates, not a complete Subject snapshot. Source/target/dependency
// lookup and Query-ranked references share the owner's body/support read budget.
message SelfSelectionRequest {
  string subject_id = 1 [(reference_kind) = "subject"];
  SelfScope scope = 2;
  repeated CognitiveRef targets = 3;
  repeated CognitiveRef sources = 4;
  repeated CognitiveRef ranked = 5;
  // Actual selected records, 1..128; not a Subject population limit.
  uint32 max_items = 6;
  // Complete body/support read ceiling, at most 4 MiB.
  uint32 max_bytes = 7;
  string intent = 8;
  SourceReadScope source_read = 9;
}
message SelfSelectionResponse {
  repeated SelfRecord items = 1;
  repeated Degradation degradation = 2;
  string candidate_scope = 3;
}
service SelfService {
  rpc Select(SelfSelectionRequest) returns (SelfSelectionResponse);
  rpc Adopt(AdoptSelfRequest) returns (SelfRecord) {option idempotency_level = IDEMPOTENT;}
  rpc Revise(ReviseSelfRequest) returns (SelfRecord) {option idempotency_level = IDEMPOTENT;}
  rpc AddEvidence(AddSelfEvidenceRequest) returns (SelfRecord) {option idempotency_level = IDEMPOTENT;}
  rpc Get(ObjectRequest) returns (SelfRecord);
  rpc GetRevision(ObjectRequest) returns (SelfRecord);
  rpc List(SelfListRequest) returns (SelfListResponse);
  rpc ListRevisions(SelfHistoryRequest) returns (SelfListResponse);
  rpc SetLifecycle(SelfLifecycleRequest) returns (SelfRecord) {option idempotency_level = IDEMPOTENT;}
  rpc Purge(SelfMutationRequest) returns (google.protobuf.Empty) {option idempotency_level = IDEMPOTENT;}
}
