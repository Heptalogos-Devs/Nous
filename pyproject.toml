[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nous-server"
version = "0.1.0"
description = "Nous cognitive service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiosqlite>=0.21,<1",
  "click>=8.1,<9",
  "filelock>=3,<4",
  "opentelemetry-api>=1,<2",
  "opentelemetry-sdk>=1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "platformdirs>=4,<5",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2,<3",
  "rich>=14,<15",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "structlog>=25,<27",
  "tomlkit>=0.13,<1",
  "typer>=0.19,<1",
  "typing-extensions>=4.16,<5",
  "tzdata>=2025.2",
]

[project.scripts]
nous = "nous.transports.cli:main"

[dependency-groups]
dev = [
  "babel>=2,<3",
  "basedpyright>=1.31,<2",
  "ruff>=0.14,<1",
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nous"]

[tool.hatch.build.targets.sdist]
include = ["src/nous", "pyproject.toml", "README.md"]

[tool.basedpyright]
include = ["src"]
exclude = ["legacy", "temp", ".venv", "dist"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportExplicitAny = "error"
reportMissingTypeStubs = "warning"

[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = "temp/cache/ruff"
extend-exclude = ["legacy", "temp", ".venv", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["E701"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
cache_dir = "temp/cache/pytest"
