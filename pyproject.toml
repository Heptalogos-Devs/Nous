[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nous-server"
version = "0.1.0"
description = "Nous cognitive service"
license = "CC-BY-NC-SA-4.0 AND Apache-2.0"
license-files = ["LICENSE", "src/nous_native/licenses/*"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiosqlite>=0.21,<1",
  "click>=8.1,<9",
  "filelock>=3,<4",
  "opentelemetry-api>=1,<2",
  "opentelemetry-sdk>=1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "platformdirs>=4,<5",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2,<3",
  "rich>=14,<15",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "structlog>=25,<27",
  "tomlkit>=0.13,<1",
  "typer>=0.27.2,<1",
  "typing-extensions>=4.16,<5",
  "tzdata>=2025.2",
  "pydantic-ai-slim[openai]>=2.65,<3",
  "jinja2>=3.1.6,<4",
  "jsonschema>=4.26,<5",
  "numpy>=2.5.4,<3",
  "pillow>=13,<14",
  "pypdfium2>=5.14,<6",
  "httpx2[socks]>=2.16,<3",
  "openai>=3.42.1,<4",
  "markdown-it-py>=4.2,<5",
  "lark>=1.2,<2",
  "mcp>=2,<3",
  "grpcio>=1.76,<2",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
  "uniseg>=0.10.1,<1",
  "jsonpointer>=3.11,<4",
]

[project.scripts]
nous = "nous.transports.cli:main"

[dependency-groups]
dev = [
  "babel>=2,<3",
  "basedpyright>=1.31,<2",
  "ruff>=0.14,<1",
  "pytest>=8,<10",
]

[tool.maturin]
manifest-path = "native/python/Cargo.toml"
python-source = "src"
python-packages = ["nous", "nous_native"]
module-name = "nous_native._core"
bindings = "pyo3"
locked = true
use-base-python = true

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "native/Cargo.toml" },
  { file = "native/Cargo.lock" }, { file = "native/**/Cargo.toml" },
  { file = "native/**/*.rs" }, { file = "src/**/*.py" },
  { file = "src/**/*.pyi" }, { file = "src/**/py.typed" },
  { file = "src/**/licenses/*" }, { file = "src/nous/models/resources/**/*" },
  { file = "src/nous/presentation/locales/**/*" },
  { file = "src/nous_native/resources/*.json" },
]

[tool.basedpyright]
stubPath = "typings"
extraPaths = ["src"]
include = ["src", "tests", "scripts/check"]
exclude = ["legacy", "temp", ".venv", "dist"]
ignore = ["legacy", "temp", "typings/pypdfium2"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportExplicitAny = "error"
reportMissingTypeStubs = "warning"

[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = "temp/cache/ruff"
extend-exclude = ["legacy", "temp", ".venv", "dist"]

[tool.ruff.per-file-target-version]
"scripts/temp/*.py" = "py39"

[tool.ruff.lint]
exclude = ["typings/pypdfium2"]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["nous", "nous_native"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["E701"]
"typings/pypdfium2/**" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
cache_dir = "temp/cache/pytest"

[tool.codex-python-diagnostics]
generated-stubs = [
  { paths = ["typings/pypdfium2/**/*.pyi"], marker = "This type stub file was generated by pyright." },
]
