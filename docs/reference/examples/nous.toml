# 放到 ConfigurationRoot/nous.toml；凭据放 SecretRoot/gateway.env 或环境变量。
# Gateway 地址只是连接示例。获得实际端口和模型信息后填写并 enabled=true。
# 空 model 标识报告 NOT_CONFIGURED；本模板不会调用模型。
[host]
port = 9470
dotenv_file = "gateway.env"

[database]
mode = "managed_private"
# external 模式使用 url_env = "NOUS_DATABASE_URL"。

[models.gateway_profiles.local]
base_url = "http://127.0.0.1:3000/v1"
credential_env = "NOUS_GATEWAY_TOKEN"
enabled = false
request_timeout_ms = 30000

# ModelProfile 是模型资源；ExecutionProfile 是调用控制；RolePolicy 选择执行路线。
# 仅声明实际支持的能力；音视频输入须经网关和模型实际确认。
[models.model_profiles.text]
gateway = "local"
protocol = "openai-chat"
model = ""
capabilities = ["text", "structured_output"]

[models.model_profiles.media]
gateway = "local"
protocol = "openai-chat"
model = ""
capabilities = ["text", "image_input", "audio_input", "video_input", "structured_output"]

[models.model_profiles.embedding]
gateway = "local"
protocol = "openai-embeddings"
model = ""
capabilities = ["embedding"]
[models.model_profiles.embedding.embedding]
# 接入时填写实际维度、权重修订和输出语义；这里的值不用于真实调用。
dimension = 1
max_batch_size = 64
weights_revision = "REPLACE_WEIGHTS_REVISION"
task = "retrieval"
input_representation = "text"
preprocessing_identity = "utf8"
preprocessing_revision = "1"
normalization = "none"
output_semantics = "dense_vector"

[models.model_profiles.rerank]
gateway = "local"
protocol = "rerank-v1"
model = ""
capabilities = ["rerank"]

[models.model_profiles.speech]
gateway = "local"
protocol = "openai-audio-transcription"
model = ""
capabilities = ["speech_transcription"]

# 控制按实际模型能力设置；不支持 sampling 的模型删除 temperature。
[models.execution_profiles.text]
model = "text"
temperature = 0.1
max_output_tokens = 4096
[models.execution_profiles.media]
model = "media"
max_output_tokens = 8192
[models.execution_profiles.embedding]
model = "embedding"
[models.execution_profiles.rerank]
model = "rerank"
[models.execution_profiles.speech]
model = "speech"

# optional 允许未配置能力明确降级；required 使依赖该角色的操作失败。
# 默认 Prompt 属于各 role；覆盖用 prompt = "config-prompts/<文件>"。
[models.roles.memory_formation]
routes = ["text"]
requirement = "optional"

[models.roles.projection_steward]
routes = ["text"]
requirement = "optional"

[models.roles.episode_segmentation]
routes = ["text"]
requirement = "optional"

[models.roles.journal_synthesis]
routes = ["text"]
requirement = "optional"

[models.roles.memory_consolidation]
routes = ["text"]
requirement = "optional"

[models.roles.concept_maintenance]
routes = ["text"]
requirement = "optional"

[models.roles.query_concept_enrichment]
routes = ["text"]
requirement = "optional"

[models.roles.material_description]
routes = ["media"]
requirement = "optional"

[models.roles.material_structuring]
routes = ["text"]
requirement = "optional"

[models.roles.material_direct_structuring]
routes = ["media"]
requirement = "optional"

[models.roles.query_embedding]
routes = ["embedding"]
requirement = "optional"

[models.roles.query_rerank]
routes = ["rerank"]
requirement = "optional"

[models.roles.speech_transcription]
routes = ["speech"]
requirement = "optional"

[material]
# description_only / direct_structured / describe_then_structure
strategy = "description_only"
[audio]
# direct 多模态理解；transcription 使用 speech_transcription。
input_mode = "direct"
[video]
# direct 原视频；frames 明确选择已安装 FFmpeg 的有界抽帧。
input_mode = "direct"
# ffmpeg_executable = "/absolute/path/to/ffmpeg"

[[consumers]]
consumer_id = "default"
memory = "PREFERRED"
runtime = "OPTIONAL"
resource = "OPTIONAL"
max_items = 32
max_text_bytes = 32768
materialize = true
