# 合并到开发实例的 nous.toml。先按实际 Docker 映射和 /v1/models 结果替换占位值。
# 本文件不包含 instance 节，不能替代 init 生成的完整实例配置。

[credentials.gateway-key]
kind = "file"
path = "credentials/gateway.key"

[providers.gateway]
protocol = "openai-chat-completions"
endpoint = "http://127.0.0.1:3000/v1" # 仅示例，必须改为实际可达映射。
credential_ref = "gateway-key"

[models.text]
provider = "gateway"
model_name = "REPLACE_WITH_ACTUAL_TEXT_MODEL"
capabilities = ["text", "stream", "structured_output"]
input_formats = ["text/plain"]
output_modes = ["text", "native"]

[models.vision]
provider = "gateway"
model_name = "REPLACE_WITH_ACTUAL_VISION_MODEL"
capabilities = ["text", "image", "structured_output"]
input_formats = ["text/plain", "image/png", "image/jpeg"]
output_modes = ["text", "native"]

[models.text-embedding]
provider = "gateway"
model_name = "REPLACE_WITH_ACTUAL_EMBEDDING_MODEL"
capabilities = ["embedding"]
input_formats = ["text/plain"]

[presets.reading]
max_output_tokens = 4096

[model_execution]
max_output_tokens = 4096
# 金额上限不设置。模型或网关未提供价格，不阻断真实调用。

[tasks.summarize]
model = "text"
preset = "reading"
prompt = "summarize"
output_mode = "text"

[tasks.describe-media]
model = "vision"
preset = "reading"
prompt = "describe-media"
output_mode = "text"

[tasks.extract-information]
model = "vision"
preset = "reading"
prompt = "extract-information"
output_mode = "native"

[tasks.select-passages]
model = "text"
prompt = "select-passages"
output_mode = "native"

[media.analysis]
description_task = "describe-media"
extraction_task = "extract-information"

# 音频转写资源由真实模型目录和端点支持情况补充。
# Embedding 空间也在 probe 返回实际维度后填写，不预设一个猜测维度。
