# 合并到开发实例的 nous.toml。先按实际 Docker 映射和 /v1/models 结果替换占位值。
# 本文件不包含 instance 节，不能替代 init 生成的完整实例配置。

[credentials.gateway-key]
kind = "file"
path = "credentials/gateway.key"

[providers.gateway]
protocol = "openai-chat-completions"
endpoint = "http://127.0.0.1:3000/v1" # 仅示例，必须改为实际可达映射。
credential_ref = "gateway-key"

[models.text]
provider = "gateway"
model_name = "REPLACE_WITH_ACTUAL_GENERAL_MODEL"
capabilities = ["text", "image"]
input_formats = ["text/plain", "image/png"]
output_modes = ["text"]

# 按实际服务支持的媒体格式声明能力；这里只展示一种多媒体路线。
[models.multimodal]
provider = "gateway"
model_name = "REPLACE_WITH_ACTUAL_MULTIMODAL_MODEL"
capabilities = ["text", "image", "audio", "video"]
input_formats = ["text/plain", "image/png", "audio/wav", "video/mp4"]
output_modes = ["text"]

[models.text-embedding]
provider = "gateway"
model_name = "REPLACE_WITH_ACTUAL_EMBEDDING_MODEL"
capabilities = ["embedding"]
input_formats = ["text/plain"]

[presets.reading]
max_output_tokens = 4096

[model_execution]
max_output_tokens = 4096
# 金额上限不设置。模型或网关未提供价格，不阻断真实调用。

[tasks.summarize]
model = "text"
preset = "reading"
prompt = "summarize"
output_mode = "text"

[tasks.describe-media]
model = "multimodal"
preset = "reading"
prompt = "describe-media"
output_mode = "text"

[tasks.extract-information]
model = "multimodal"
preset = "reading"
prompt = "extract-information"
output_mode = "prompted"

[tasks.select-passages]
model = "text"
prompt = "select-passages"
output_mode = "prompted"

[tasks.arrange-reading]
model = "text"
prompt = "arrange-reading"
output_mode = "prompted"

[tasks.evaluate-passages]
model = "text"
prompt = "evaluate-passages"
output_mode = "prompted"

