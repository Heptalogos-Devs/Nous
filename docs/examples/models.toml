[tasks.journal-draft]
model = "text"
prompt = "journal-draft"
output_mode = "text"

[tasks.journal-edit]
model = "text"
prompt = "journal-edit"
output_mode = "prompted"

[tasks.journal-rewrite]
model = "text"
prompt = "journal-rewrite"
output_mode = "text"

[tasks.journal-reflect]
model = "text"
prompt = "journal-reflect"
output_mode = "text"

[cognition.edit]
task = "journal-edit"

[cognition.rewrite]
task = "journal-rewrite"

[cognition.reflection]
task = "journal-reflect"

[tasks.annotate-concepts]
model = "text"
prompt = "annotate-concepts"
output_mode = "prompted"

[media.analysis]
description_task = "describe-media"
extraction_task = "extract-information"

# 音频转写资源由真实模型目录和端点支持情况补充。
# Embedding 空间也在 probe 返回实际维度后填写，不预设一个猜测维度。
