# Paths and glob patterns are relative to the repository root.
[corpus]
text = ["docs/CURRENT.md", "docs/ARCHITECTURE.md", "docs/README.md", "docs/design/**/*.md", "docs/development/**/*.md", "docs/plans/*.md", "src/nous/*.md", "temp/test-materials/Text/0-*.md"]
docstrings = ["src/nous/**/*.py"]

[[draft]]
name = "项目检索与证据"
topic = "理解当前检索、来源与独立证据"
sources = [
  { path = "docs/design/cognition/current-retrieval.md" },
  { path = "docs/design/wave/evidence-projection.md" },
]

[[draft]]
name = "猫咪视频"
