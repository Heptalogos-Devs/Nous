# 可将本节加入实例 nous.toml，再用 --program example_text 调用。
[wave.programs.example_text]
outputs = { evidence = { node = "deliver", port = "evidence" } }

[[wave.programs.example_text.nodes]]
id = "lexical"
operator = "lexical.search"
inputs = { text = { node = "query", port = "lexical" }, snapshot = { node = "snapshot", port = "handle" }, allowed = { node = "scope", port = "allowed" } }

[[wave.programs.example_text.nodes]]
id = "rank"
operator = "rank.from_lane"
inputs = { candidates = { node = "lexical", port = "candidates" } }
parameters = { lane = "bm25" }

[[wave.programs.example_text.nodes]]
id = "context_recall"
operator = "context.recall"
inputs = { signals = { node = "query", port = "context_lexical" }, snapshot = { node = "snapshot", port = "handle" }, allowed = { node = "scope", port = "allowed" } }

[[wave.programs.example_text.nodes]]
id = "context"
operator = "rank.context"
inputs = { ranked = { node = "rank", port = "ranked" }, candidates = { node = "context_recall", port = "candidates" } }

[[wave.programs.example_text.nodes]]
id = "locate"
operator = "passages.locate"
inputs = { ranked = { node = "context", port = "ranked" }, intent = { node = "query", port = "intent" }, snapshot = { node = "snapshot", port = "handle" } }
parameters = { signals = ["lexical"] }

[[wave.programs.example_text.nodes]]
id = "select"
operator = "passages.select"
inputs = { passages = { node = "locate", port = "passages" }, delivery = { node = "delivery", port = "request" } }

[[wave.programs.example_text.nodes]]
id = "deliver"
operator = "delivery.read"
inputs = { selected = { node = "select", port = "selected" }, materials = { node = "scope", port = "materials" } }
