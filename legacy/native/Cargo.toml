[workspace]
members = ["vcp", "retrieval", "nousql-syntax", "python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
nous-vcp = { path = "vcp" }
nous-retrieval = { path = "retrieval" }
nousql-syntax = { path = "nousql-syntax" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision", "raw_value"] }
schemars = "1"
nalgebra = { version = "0.35", features = ["serde-serialize"] }
rayon = "1"
sha2 = "0.10"
tempfile = "3"
tantivy = "0.27"
uuid = { version = "1", features = ["v4", "serde"] }
usearch = { version = "=2.26.2", default-features = false }
winnow = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0
incremental = true

[profile.release]
strip = "debuginfo"
lto = "thin"

[profile.native-debug]
inherits = "dev"
debug = 1
