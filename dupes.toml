# Duplication is review input: normalized names also match legitimate owner adapters.
# Keep the report visible without forcing abstraction to meet a group-count quota.
min_nodes = 15
min_lines = 5
similarity_threshold = 0.85

# Keep authored production code in the report; generated, test and ignored local data trees are excluded.
exclude = ["target", "data", "tests", "benches", "generated"]

exclude_tests = true
