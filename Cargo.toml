[workspace]
members = [
    "crates/nous-domain",
    "crates/nous-storage",
    "crates/nous-foundation",
    "crates/nous-app",
    "crates/nous-retrieval",
    "crates/nous-vcp",
    "crates/nous",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/Heptalogos-Devs/Nous-Wave"

[workspace.dependencies]
nous-domain = { path = "crates/nous-domain" }
nous-storage = { path = "crates/nous-storage" }
nous-foundation = { path = "crates/nous-foundation" }
nous-app = { path = "crates/nous-app" }
nous-retrieval = { path = "crates/nous-retrieval" }
nous-vcp = { path = "crates/nous-vcp" }
anyhow = "1"
base64 = "0.23"
apalis = { version = "1.0.0", features = ["retry", "task-context"] }
apalis-core = "1.0.0"
apalis-sqlite = "1.0.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
futures = "0.3"
genai = { version = "=0.7.0", default-features = false, features = ["rustls-tls"] }
minijinja = { version = "3.0", features = ["fuel", "serde"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
process-wrap = { version = "=10.0.1", features = ["tokio1"] }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
rayon = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
rust_decimal = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tempfile = "3"
tantivy = "0.27"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tower = "0.5"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "3", features = ["serde"] }
usearch = { version = "=2.26.2", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
