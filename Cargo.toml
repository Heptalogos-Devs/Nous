[workspace]
resolver = "3"
members = ["crates/*", "apps/nous-kernel"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "fs",
    "sync",
    "time",
    "net",
    "io-std",
    "io-util",
] }
sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
opendal = { version = "=0.58.2", default-features = false, features = [
    "services-fs",
    "executors-tokio",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "=0.28.0", features = ["derive"] }
schemars = "=1.2.2"
jsonschema = { version = "=0.58.5", default-features = false }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
toml = "0.9"
tempfile = "3"
futures = "0.3"
async-stream = "0.3.6"
postgresql_embedded = { version = "=0.21.0", default-features = false, features = [
    "tokio",
    "tls-rustls-ring",
] }
usearch = "=2.26.2"
tantivy = { git = "https://github.com/quickwit-oss/tantivy", rev = "5ca39332002c2c87fb5d2abc707cf527b3319d42" }
nalgebra = "=0.35.0"
roaring = { version = "=0.11.5", features = ["serde"] }
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
prost = "=0.14.4"
prost-types = "=0.14.4"
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-health = "=0.14.6"
tokio-stream = { version = "0.1", features = ["net"] }
nous-protocol = { path = "crates/protocol" }
nous-core = { path = "crates/core" }
nous-subject = { path = "crates/subject" }
nous-runtime = { path = "crates/runtime" }
nous-material = { path = "crates/material" }
nous-object-store = { path = "crates/object-store" }
nous-memory = { path = "crates/memory" }
nous-persistence = { path = "crates/persistence" }
nous-retrieval = { path = "crates/retrieval" }
nous-configuration = { path = "crates/configuration" }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
# Cohesive owner transactions and full protocol mappings are reviewed by responsibility.
excessive_nesting = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_futures = "warn"
large_enum_variant = "warn"
fn_params_excessive_bools = "warn"
